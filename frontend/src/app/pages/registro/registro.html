<div class="registro-container">
  <div class="registro-card">
    <div class="registro-header">
      <div class="logo-circle">U</div>
      <h2>Crear Cuenta Estudiantil</h2>
      <p class="subtitle">Únete a la comunidad de compra y venta de tu universidad</p>
    </div>

    <!-- Alertas visuales de error y éxito -->
    <div *ngIf="errorMensaje" class="alert-box alert-error">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMensaje }}</span>
    </div>

    <div *ngIf="exitoMensaje" class="alert-box alert-success">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>{{ exitoMensaje }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" class="registro-form">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input 
          type="text" 
          id="nombre" 
          name="nombre" 
          [(ngModel)]="nombre" 
          placeholder="Ej. Juan Pérez" 
          required 
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="correo">Correo Institucional (@utp.edu.pe)</label>
        <input 
          type="email" 
          id="correo" 
          name="correo" 
          [(ngModel)]="correo" 
          placeholder="u12345678@utp.edu.pe" 
          required 
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="Mínimo 4 caracteres" 
          required 
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="carrera">Carrera Universitaria</label>
        <input 
          type="text" 
          id="carrera" 
          name="carrera" 
          [(ngModel)]="carrera" 
          placeholder="Ej. Ingeniería de Sistemas" 
          class="form-control"
        />
      </div>

      <button type="submit" class="btn-submit" [disabled]="cargando">
        {{ cargando ? 'Registrando cuenta...' : 'Registrarme en U-Market' }}
      </button>

      <p class="login-redirect">
        ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
      </p>
    </form>
  </div>
</div>
