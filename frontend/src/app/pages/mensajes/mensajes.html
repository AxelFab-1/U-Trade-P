<section class="mensajes-view-container form-view-container">
  <div class="mensajes-card form-card">
    <div class="mensajes-header">
      <div class="header-titles">
        <h1 class="mensajes-title">Mensajes</h1>
      </div>
      <div class="inbox-status">
        <span class="status-indicator"></span>
        <span class="status-text">Bandeja activa</span>
      </div>
    </div>

    <!-- Buscador de conversaciones -->
    <div class="search-box">
      <div class="search-input-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input
          type="text"
          class="form-control"
          placeholder="Buscar conversación..."
        />
      </div>
    </div>

    <!-- Estado de Bandeja Vacía -->
    <div class="empty-inbox-container">
      <div class="empty-icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" fill="none" viewBox="0 0 24 24" stroke="#94A3B8" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
      </div>

      <h3 class="empty-title">Sin mensajes nuevos</h3>
      <p class="empty-description">
        Las conversaciones con otros estudiantes sobre compras y publicaciones aparecerán aquí.
      </p>

      <div class="empty-actions">
        <a routerLink="/explorar" class="btn-pill btn-primary btn-block">
          Explorar Catálogo
        </a>
      </div>
    </div>
  </div>
</section>
