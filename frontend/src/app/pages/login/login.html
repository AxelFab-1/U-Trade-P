<section class="login-view-container form-view-container">
  <div class="login-card form-card">
    <div class="login-header">
      <div class="brand-badge">U-Market</div>
      <h1 class="login-title">Iniciar Sesión</h1>
      <p class="login-subtitle">Accede con tu cuenta institucional UTP</p>
    </div>

    <!-- Alerta de Éxito -->
    @if (exitoMensaje()) {
      <div class="alert-box alert-success">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span>{{ exitoMensaje() }}</span>
      </div>
    }

    <!-- Alerta de Error -->
    @if (errorMensaje()) {
      <div class="alert-box alert-error">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMensaje() }}</span>
      </div>
    }

    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="correo" class="form-label">Correo Institucional UTP</label>
        <input
          type="email"
          id="correo"
          name="correo"
          [ngModel]="correo()"
          (ngModelChange)="correo.set($event)"
          class="form-control"
          placeholder="u12345678@utp.edu.pe"
          required
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <div class="password-input-wrapper">
          <input
            [type]="verPassword() ? 'text' : 'password'"
            id="password"
            name="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            class="form-control"
            placeholder="••••••••"
            required
          />
          <button 
            type="button" 
            class="btn-toggle-eye" 
            (click)="toggleVerPassword()" 
            [title]="verPassword() ? 'Ocultar contraseña' : 'Ver contraseña'">
            @if (!verPassword()) {
              <!-- Ojo abierto -->
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            } @else {
              <!-- Ojo tachado -->
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="login-options">
        <label class="remember-me">
          <input type="checkbox" />
          <span>Recordar sesión</span>
        </label>
        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-pill btn-primary btn-block" [disabled]="cargando()">
        @if (!cargando()) {
          <span>Iniciar Sesión</span>
        } @else {
          <span class="spinner-inline">
            Iniciando sesión...
          </span>
        }
      </button>

      <div class="register-prompt">
        <span>¿Aún no tienes cuenta?</span>
        <a routerLink="/registro">Regístrate</a>
      </div>
    </form>
  </div>
</section>
