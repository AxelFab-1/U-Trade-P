<section class="login-view-container form-view-container">
  <div class="login-card form-card">
    <div class="login-header">
      <div class="brand-badge">U-Trade-P</div>
      <h1 class="login-title">Iniciar Sesión</h1>
      <p class="login-subtitle">Accede con tu cuenta institucional para comprar y vender en la comunidad</p>
    </div>

    <div *ngIf="errorMensaje" class="alert-error" style="background-color: #FEE2E2; color: #DC2626; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.875rem;">
      {{ errorMensaje }}
    </div>

    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="correo" class="form-label">Correo Institucional</label>
        <input
          type="email"
          id="correo"
          name="correo"
          [(ngModel)]="correo"
          class="form-control"
          placeholder="ejemplo@utp.edu.pe"
          required
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          class="form-control"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="login-options">
        <label class="remember-me">
          <input type="checkbox" />
          <span>Recordar sesión</span>
        </label>
        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-pill btn-primary btn-block" [disabled]="cargando">
        {{ cargando ? 'Iniciando sesión...' : 'Ingresar a U-Market' }}
      </button>

      <div class="register-prompt">
        <span>¿Aún no tienes cuenta?</span>
        <a routerLink="/registro">Regístrate aquí</a>
      </div>
    </form>
  </div>
</section>
