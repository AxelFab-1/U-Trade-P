<header class="app-header">
  <a class="logo" routerLink="/explorar" title="U-Market">
    <div class="logo-icon">U</div>
    <span class="logo-text">U-Market</span>
  </a>
  
  <div class="header-actions">
    <a class="nav-item desktop-only" routerLink="/explorar" routerLinkActive="active">Explorar</a>
    <a class="nav-item desktop-only" routerLink="/publicar" routerLinkActive="active">Publicar</a>
    
    @if (authService.isLoggedIn() && authService.isAdmin()) {
      <a class="nav-item admin-pill" routerLink="/admin" routerLinkActive="active" title="Panel de Administración">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Panel Admin</span>
      </a>
    }

    <!-- Botón sencillo de Modo Oscuro (Icono de Sol) -->
    <button 
      type="button" 
      class="theme-toggle-btn" 
      (click)="toggleTheme()" 
      [attr.aria-label]="themeService.isDarkMode() ? 'Activar modo claro' : 'Activar modo oscuro'"
      [title]="themeService.isDarkMode() ? 'Modo oscuro activo (clic para modo claro)' : 'Modo claro activo (clic para modo oscuro)'">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>

    @if (!authService.isLoggedIn()) {
      <a class="auth-btn login-link" routerLink="/login">Iniciar Sesión</a>
      <a class="auth-btn register-link" routerLink="/registro">Registrarse</a>
    } @else {
      <button class="profile-btn" routerLink="/perfil" title="Mi Perfil">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="user-chip-text">{{ authService.currentUserEmail() ? (authService.currentUserEmail()?.split('@')?.[0]) : 'Perfil' }}</span>
      </button>
      <button class="logout-btn" (click)="logout()" title="Cerrar Sesión">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    }
  </div>
</header>
