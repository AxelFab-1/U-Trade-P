spring.application.name=umarket

# --- Base de datos H2 en archivo (persiste los datos) ---
spring.datasource.url=jdbc:h2:file:./data/utradedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Configuración de Correo SMTP Oficial (Gmail U-Market) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=umarketutp@gmail.com
spring.mail.password=sjaevfaysqlhjedo
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000
