spring.application.name=umarket

# Carga automática de archivo .env en desarrollo local (ignorado si no existe en producción)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Puerto del servidor (Render inyecta PORT dinámicamente) ---
server.port=${PORT:8080}

# --- Base de datos (H2 local por defecto; PostgreSQL en producción vía variables de entorno) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/utradedb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# --- Consola web de H2 (activa por defecto en local; desactivable vía variable) ---
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# --- Seguridad JWT ---
jwt.secret=${JWT_SECRET:clave-secreta-utrade-desarrollo-web-2026-256b}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS (orígenes permitidos separados por coma) ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Configuración de Correo SMTP (local) y Brevo API HTTPS (producción en Render) ---
brevo.api-key=${BREVO_API_KEY:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000
